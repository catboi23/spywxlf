<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glitch Timer</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #2a2a2a;
      font-family: Arial, sans-serif;
      color: #7ec8ff;
      overflow: hidden;
      position: relative;
    }

    /* ← BACK ARROW */
    .back-arrow {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 1.4rem;
      color: #9ca3af; /* soft grey */
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 10;
    }

    .back-arrow:hover {
      opacity: 1;
      transform: translateX(-3px);
    }

    /* Scan-line flicker */
    body::before {
      content: "";
      position: fixed;
      inset: -50px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(126, 200, 255, 0.08) 0px,
        rgba(126, 200, 255, 0.08) 1px,
        transparent 2px,
        transparent 3px
      );
      mix-blend-mode: screen;
      opacity: 0.4;
      pointer-events: none;
      animation: flicker 2.5s infinite;
    }

    /* Static broken bars */
    body::after {
      content: "";
      position: fixed;
      inset: -40px;
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.7) 10%,
        rgba(0, 0, 0, 0) 20%,
        rgba(0, 0, 0, 0.7) 30%,
        rgba(0, 0, 0, 0) 40%,
        rgba(0, 0, 0, 0.7) 55%,
        rgba(0, 0, 0, 0) 65%,
        rgba(0, 0, 0, 0.7) 75%,
        rgba(0, 0, 0, 0) 100%
      );
      mix-blend-mode: multiply;
      opacity: 0.25;
      pointer-events: none;
    }

    .wrapper {
      text-align: center;
      font-size: 3rem;
      z-index: 1;
    }

    .symbol {
      font-size: 4.2rem;
      margin-bottom: 0.4rem;
      font-family: "Consolas", "Courier New", monospace;
      transform: scaleX(1.25);
      text-shadow:
        0 0 6px rgba(126, 200, 255, 0.8),
        -3px 0 4px rgba(0, 255, 255, 0.4),
        3px 0 4px rgba(0, 150, 255, 0.4);
    }

    #countup {
      letter-spacing: 0.05em;
      text-shadow:
        0 0 6px rgba(126, 200, 255, 0.8),
        -2px 0 4px rgba(0, 255, 255, 0.4),
        2px 0 4px rgba(0, 150, 255, 0.4);
      white-space: nowrap;
    }

    @keyframes flicker {
      0%, 19%, 21%, 64%, 100% { opacity: 0.35; }
      20%, 22%, 63% { opacity: 0.65; }
      50% { opacity: 0.15; }
      70% { opacity: 0.5; }
    }
  </style>
</head>

<body>
  <!-- BACK ARROW -->
  <a class="back-arrow" href="https://www.hyperfollow.com/spywxlf" aria-label="Back">
    ←
  </a>

  <div class="wrapper">
    <div class="symbol">⧖</div>
    <div id="countup">Loading...</div>
  </div>

  <script>
    // Start: March 27, 2023, 12:00 AM America/New_York
    // That date is EDT (UTC-4) → 2023-03-27T04:00:00Z
    const startTime = new Date("2023-03-27T04:00:00Z");
    const el = document.getElementById("countup");

    function addYearsUTC(date, years) {
      const d = new Date(date.getTime());
      d.setUTCFullYear(d.getUTCFullYear() + years);
      return d;
    }

    function fullYearsElapsed(start, now) {
      let years = 0;
      let anchor = new Date(start.getTime());

      while (true) {
        const next = addYearsUTC(anchor, 1);
        if (next <= now) {
          years++;
          anchor = next;
        } else {
          break;
        }
      }
      return { years, anchor };
    }

    function update() {
      const now = new Date();
      if (now < startTime) {
        el.textContent = "0:0:00:00:00";
        return;
      }

      const { years, anchor } = fullYearsElapsed(startTime, now);
      const diffMs = now - anchor;

      const totalSeconds = Math.floor(diffMs / 1000);
      const seconds = totalSeconds % 60;
      const totalMinutes = Math.floor(totalSeconds / 60);
      const minutes = totalMinutes % 60;
      const totalHours = Math.floor(totalMinutes / 60);
      const hours = totalHours % 24;
      const days = Math.floor(totalHours / 24);

      el.textContent =
        `${years}:${days}:${String(hours).padStart(2, "0")}:` +
        `${String(minutes).padStart(2, "0")}:` +
        `${String(seconds).padStart(2, "0")}`;
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
