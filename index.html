<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>⧖</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #2a2a2a;
      font-family: Arial, sans-serif;
      color: #7ec8ff;
      position: relative;
      padding: 28px;
    }

    /* Scan-line flicker */
    body::before {
      content: "";
      position: fixed;
      inset: -60px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(126, 200, 255, 0.08) 0px,
        rgba(126, 200, 255, 0.08) 1px,
        transparent 2px,
        transparent 3px
      );
      mix-blend-mode: screen;
      opacity: 0.4;
      pointer-events: none;
      animation: flicker 2.5s infinite;
    }

    /* Broken bars */
    body::after {
      content: "";
      position: fixed;
      inset: -60px;
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.7) 10%,
        rgba(0, 0, 0, 0) 20%,
        rgba(0, 0, 0, 0.7) 30%,
        rgba(0, 0, 0, 0) 40%,
        rgba(0, 0, 0, 0.7) 55%,
        rgba(0, 0, 0, 0) 65%,
        rgba(0, 0, 0, 0.7) 75%,
        rgba(0, 0, 0, 0) 100%
      );
      mix-blend-mode: multiply;
      opacity: 0.25;
      pointer-events: none;
    }

    .wrapper {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 900px;
      z-index: 1;
      overflow: visible;

      position: relative;
      padding-top: 2.25em;
    }

    /* ===== Typed message ===== */
    .typed-line {
      position: absolute;
      top: -0.45em;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 24px);
      text-align: center;

      display: none;

      font-family: "Trebuchet MS", "Verdana", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(0.95rem, 3.6vw, 1.15rem);

      color: var(--typed-color, rgba(0, 0, 0, 0.45));
      letter-spacing: 0.01em;
      user-select: none;
      white-space: pre;
      mix-blend-mode: multiply;
      opacity: 0.82;
      pointer-events: none;

      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .cursor {
      display: inline-block;
      width: 0.55ch;
      margin-left: 0.12ch;
      transform: translateY(1px);
      animation: cursorBlink 0.85s steps(1, end) infinite;
      color: inherit;
      font-weight: 800;
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Flicker ONCE then gone */
    .typed-line.flicker-once {
      animation: flickerOnce 0.22s steps(1, end) forwards;
    }

    @keyframes flickerOnce {
      0%   { opacity: 0.82; }
      45%  { opacity: 0.05; }
      100% { opacity: 0; }
    }

    .symbol {
      font-size: clamp(2.8rem, 7vw, 4.2rem);
      font-family: "Consolas", "Courier New", monospace;
      transform: scaleX(1.25);
      user-select: none;
      line-height: 1;

      text-shadow:
        0 0 6px rgba(126, 200, 255, 0.8),
        -3px 0 4px rgba(0, 255, 255, 0.4),
        3px 0 4px rgba(0, 150, 255, 0.4);
    }

    #countup {
      font-size: clamp(1.6rem, 6vw, 3rem);
      letter-spacing: 0.05em;
      white-space: nowrap;

      text-shadow:
        0 0 6px rgba(126, 200, 255, 0.8),
        -2px 0 4px rgba(0, 255, 255, 0.4),
        2px 0 4px rgba(0, 150, 255, 0.4);
    }

    .back-arrow {
      margin-top: 26px; /* a little lower */
      font-size: clamp(1.15rem, 4.2vw, 1.55rem);
      color: #4b4b4b;   /* closer to background, harder to see */
      text-decoration: none;
      padding: 8px 14px;
      transition: color 0.25s ease, transform 0.25s ease;
    }

    .back-arrow:hover {
      color: #666;
      transform: translateX(-3px);
    }

    @keyframes flicker {
      0%, 19%, 21%, 64%, 100% { opacity: 0.35; }
      20%, 22%, 63% { opacity: 0.65; }
      50% { opacity: 0.15; }
      70% { opacity: 0.5; }
    }

    /* ===== MELTDOWN MODE ===== */
    body.meltdown::before {
      opacity: 0.9;
      animation: meltdownFlicker 0.12s infinite;
      filter: contrast(1.4) saturate(1.6);
    }

    body.meltdown::after {
      opacity: 0.65;
      animation: tearShift 0.12s infinite steps(2, end);
      filter: contrast(1.5);
      mix-blend-mode: hard-light;
    }

    body.meltdown .symbol,
    body.meltdown #countup {
      animation: textGlitch 0.09s infinite steps(2, end);
      filter: contrast(1.35) saturate(1.4);
      text-shadow:
        0 0 14px rgba(126, 200, 255, 1),
        -6px 0 3px rgba(0, 255, 255, 0.75),
        6px 0 3px rgba(0, 150, 255, 0.75),
        0 4px 2px rgba(0, 0, 0, 0.65);
    }

    body.meltdown .back-arrow { opacity: 0.15; }

    @keyframes meltdownFlicker {
      0% { transform: translate(0,0); }
      25% { transform: translate(-2px, 1px) skewX(-2deg); }
      50% { transform: translate(3px, -2px) skewX(3deg); }
      75% { transform: translate(-1px, -3px) skewX(-2deg); }
      100% { transform: translate(0,0); }
    }

    @keyframes tearShift {
      0% { transform: translate(0,0) skewX(0deg); }
      25% { transform: translate(-10px, -3px) skewX(-6deg); }
      50% { transform: translate(8px, 2px) skewX(7deg); }
      75% { transform: translate(-6px, 4px) skewX(-5deg); }
      100% { transform: translate(0,0) skewX(0deg); }
    }

    @keyframes textGlitch {
      0% { transform: translate(0,0); }
      20% { transform: translate(-3px, 1px); }
      40% { transform: translate(4px, -2px); }
      60% { transform: translate(-2px, -3px); }
      80% { transform: translate(2px, 3px); }
      100% { transform: translate(0,0); }
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="typed-line" id="typedLine">
      <span id="typedText"></span><span class="cursor" id="typedCursor">|</span>
    </div>

    <div class="symbol" id="hourglass">⧖</div>
    <div id="countup">Loading...</div>
    <a href="https://www.hyperfollow.com/spywxlf" class="back-arrow">←</a>
  </div>

  <script>
    /* ===== Typed message system (ALL variations preserved) ===== */
    (function initTypedMessageSystem() {
      const line = document.getElementById("typedLine");
      const textEl = document.getElementById("typedText");
      const cursorEl = document.getElementById("typedCursor");

      const messages = [
        " When Will It End ?",
        "Soon ?",
        "Runn.ing 0ut 0f Ti.me",
        "Trying To Fix ∆ Broken Time-line",
        "It Will ∆LL M∆ke Sense One D∆Y",
        "*D∆¥SB3F0R3D¥1N9*"
      ];

      // On open/refresh
      const ITSME_CHANCE = 1 / 83;   // ONLY possible on load
      const ONLOAD_CHANCE = 1 / 3;   // normal phrase chance on load

      // If nothing spawns on load:
      const RETRY_INTERVAL_MS = 1000; // every second
      const RETRY_CHANCE = 0.05;      // 5% per tick

      // Typing behavior
      const TYPO_CHANCE = 0.12;       // wrong letter chance per character (non-itsme)
      const MORPH_SPEED_MS = 28;      // ⧖ sweep speed
      const POST_TYPE_PAUSE_MS = 420; // pause before morph

      let spawnedOnce = false;
      let retryTimer = null;

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function randomWrongChar(correct) {
        const pool = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789∆*?.";
        let ch = pool[rand(0, pool.length - 1)];
        if (ch === correct) ch = pool[rand(0, pool.length - 1)];
        return ch;
      }

      function nextDelay(char) {
        let d = 240 + Math.random() * 220; // slow
        if (char === " ") d += 170;
        if (char === "." || char === "?" || char === "*") d += 330;
        return d;
      }

      function resetTypedUI(isItsMe) {
        line.classList.remove("flicker-once");
        line.style.display = "block";
        textEl.textContent = "";
        cursorEl.style.animation = "";
        cursorEl.style.opacity = "";

        if (isItsMe) {
          // more golden
          line.style.setProperty("--typed-color", "rgba(255, 200, 60, 0.78)");
        } else {
          line.style.removeProperty("--typed-color");
        }
      }

      function runTyping(picked, isItsMe) {
        spawnedOnce = true;
        if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }

        resetTypedUI(isItsMe);

        let i = 0;

        function typeCorrectChar() {
          const ch = picked.charAt(i);
          textEl.textContent += ch;
          i++;

          if (i >= picked.length) {
            setTimeout(morphToHourglassesThenVanish, POST_TYPE_PAUSE_MS);
            return;
          }
          setTimeout(typeNext, nextDelay(picked.charAt(i)));
        }

        function typeWithTypo() {
          const correct = picked.charAt(i);
          const wrong = randomWrongChar(correct);

          // type wrong
          textEl.textContent += wrong;

          // pause, backspace, then type correct
          setTimeout(() => {
            textEl.textContent = textEl.textContent.slice(0, -1);
            setTimeout(() => {
              typeCorrectChar();
            }, 160 + Math.random() * 120);
          }, 200 + Math.random() * 160);
        }

        function typeNext() {
          const ch = picked.charAt(i);

          const canTypo =
            !isItsMe &&                 // "it's me" ignores typos
            ch !== " " && ch !== "\n" && ch !== "’";

          if (canTypo && Math.random() < TYPO_CHANCE) {
            typeWithTypo();
            return;
          }
          typeCorrectChar();
        }

        function morphToHourglassesThenVanish() {
          // stop cursor when morph begins
          cursorEl.style.animation = "none";
          cursorEl.style.opacity = "0";

          const chars = textEl.textContent.split("");
          let k = 0;

          const morph = setInterval(() => {
            if (k >= chars.length) {
              clearInterval(morph);
              line.classList.add("flicker-once");
              setTimeout(() => { line.style.display = "none"; }, 260);
              return;
            }
            chars[k] = "⧖";
            textEl.textContent = chars.join("");
            k++;
          }, MORPH_SPEED_MS);
        }

        setTimeout(typeNext, 450);
      }

      // ===== On load: "it's me" is ONLY possible here =====
      if (Math.random() < ITSME_CHANCE) {
        runTyping("it's me", true);
        return;
      }

      // ===== On load: normal phrase 1 in 3 =====
      if (Math.random() < ONLOAD_CHANCE) {
        runTyping(messages[Math.floor(Math.random() * messages.length)], false);
        return;
      }

      // ===== Retry: 5% every second until first spawn (normal phrases only) =====
      retryTimer = setInterval(() => {
        if (spawnedOnce) return;
        if (Math.random() < RETRY_CHANCE) {
          runTyping(messages[Math.floor(Math.random() * messages.length)], false);
        }
      }, RETRY_INTERVAL_MS);
    })();

    /* ===== Timer (leap-year accurate years+days) + meltdown ===== */
    const startTime = new Date("2023-03-27T22:53:00Z"); // Mar 27 2023, 6:53 PM EST
    const el = document.getElementById("countup");

    // Meltdown schedule: every 10 seconds, 1 in 5 chance
    const CHECK_EVERY_MS = 10_000;
    const MELTDOWN_CHANCE = 0.20;
    const MELTDOWN_MIN_MS = 2500;
    const MELTDOWN_MAX_MS = 4200;

    let inMeltdown = false;
    let normalInterval, meltdownInterval, meltdownTimeout;

    function addYearsUTC(d, y) {
      const n = new Date(d);
      n.setUTCFullYear(n.getUTCFullYear() + y);
      return n;
    }

    function fullYearsElapsed(start, now) {
      let years = now.getUTCFullYear() - start.getUTCFullYear();
      if (years < 0) years = 0;
      let anchor = addYearsUTC(start, years);

      while (anchor > now) anchor = addYearsUTC(start, --years);
      while (addYearsUTC(anchor, 1) <= now) {
        anchor = addYearsUTC(anchor, 1);
        years++;
      }
      return { years, anchor };
    }

    function render(ms) {
      const s = Math.floor(ms / 1000);
      return {
        seconds: s % 60,
        minutes: Math.floor(s / 60) % 60,
        hours: Math.floor(s / 3600) % 24,
        days: Math.floor(s / 86400)
      };
    }

    function updateNormal() {
      const now = new Date();
      const { years, anchor } = fullYearsElapsed(startTime, now);
      const r = render(now - anchor);
      el.textContent =
        `${years}:${r.days}:${String(r.hours).padStart(2,"0")}:${String(r.minutes).padStart(2,"0")}:${String(r.seconds).padStart(2,"0")}`;
    }

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function updateMeltdown() {
      const now = new Date();
      const { years, anchor } = fullYearsElapsed(startTime, now);

      // scramble by up to ~2.5 days plus micro jitter
      const fake = (now - anchor) + rand(-216000000, 216000000) + rand(-9000, 9000);
      const r = render(fake);

      el.textContent =
        `${Math.max(0, years + rand(-1, 1))}:${r.days}:${String(r.hours).padStart(2,"0")}:${String(r.minutes).padStart(2,"0")}:${String(r.seconds).padStart(2,"0")}`;
    }

    function startMeltdown() {
      if (inMeltdown) return;
      inMeltdown = true;

      document.body.classList.add("meltdown");
      clearInterval(normalInterval);

      meltdownInterval = setInterval(updateMeltdown, 45);
      meltdownTimeout = setTimeout(stopMeltdown, rand(MELTDOWN_MIN_MS, MELTDOWN_MAX_MS));
    }

    function stopMeltdown() {
      if (!inMeltdown) return;
      inMeltdown = false;

      document.body.classList.remove("meltdown");
      clearInterval(meltdownInterval);
      clearTimeout(meltdownTimeout);

      updateNormal();
      normalInterval = setInterval(updateNormal, 1000);
    }

    setInterval(() => {
      if (!inMeltdown && Math.random() < MELTDOWN_CHANCE) startMeltdown();
    }, CHECK_EVERY_MS);

    updateNormal();
    normalInterval = setInterval(updateNormal, 1000);
  </script>
</body>
</html>
