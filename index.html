<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>⧖</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #2a2a2a;
      font-family: Arial, sans-serif;
      color: #7ec8ff;
      position: relative;
      padding: 28px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -60px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(126, 200, 255, 0.08) 0px,
        rgba(126, 200, 255, 0.08) 1px,
        transparent 2px,
        transparent 3px
      );
      mix-blend-mode: screen;
      opacity: 0.4;
      pointer-events: none;
      animation: flicker 2.5s infinite;
    }

    body::after {
      content: "";
      position: fixed;
      inset: -60px;
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.7) 10%,
        rgba(0, 0, 0, 0) 20%,
        rgba(0, 0, 0, 0.7) 30%,
        rgba(0, 0, 0, 0) 40%,
        rgba(0, 0, 0, 0.7) 55%,
        rgba(0, 0, 0, 0) 65%,
        rgba(0, 0, 0, 0.7) 75%,
        rgba(0, 0, 0, 0) 100%
      );
      mix-blend-mode: multiply;
      opacity: 0.25;
      pointer-events: none;
    }

    .wrapper {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 900px;
      z-index: 1;
      position: relative;
      padding-top: 2.25em;
    }

    .typed-line {
      position: absolute;
      top: -0.45em;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      font-family: "Trebuchet MS", "Verdana", system-ui;
      font-weight: 700;
      font-size: clamp(0.95rem, 3.6vw, 1.15rem);
      color: var(--typed-color, rgba(0, 0, 0, 0.45));
      mix-blend-mode: multiply;
      opacity: 0.82;
      pointer-events: none;
      white-space: pre;
    }

    .cursor {
      animation: cursorBlink 0.85s steps(1, end) infinite;
      font-weight: 800;
      margin-left: 0.1ch;
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .typed-line.flicker-once {
      animation: flickerOnce 0.22s steps(1, end) forwards;
    }

    @keyframes flickerOnce {
      0% { opacity: 0.82; }
      45% { opacity: 0.05; }
      100% { opacity: 0; }
    }

    .symbol {
      font-size: clamp(2.8rem, 7vw, 4.2rem);
      font-family: Consolas, monospace;
      transform: scaleX(1.25);
      text-shadow:
        0 0 6px rgba(126, 200, 255, 0.8),
        -3px 0 4px rgba(0, 255, 255, 0.4),
        3px 0 4px rgba(0, 150, 255, 0.4);
    }

    #countup {
      font-size: clamp(1.6rem, 6vw, 3rem);
      letter-spacing: 0.05em;
      text-shadow:
        0 0 6px rgba(126, 200, 255, 0.8),
        -2px 0 4px rgba(0, 255, 255, 0.4),
        2px 0 4px rgba(0, 150, 255, 0.4);
    }

    .back-arrow {
      margin-top: 26px;
      font-size: clamp(1.15rem, 4.2vw, 1.55rem);
      color: #4b4b4b;
      text-decoration: none;
    }

    @keyframes flicker {
      0%, 19%, 21%, 64%, 100% { opacity: 0.35; }
      20%, 22%, 63% { opacity: 0.65; }
      50% { opacity: 0.15; }
      70% { opacity: 0.5; }
    }
  </style>
</head>

<body>
<div class="wrapper">
  <div class="typed-line" id="typedLine">
    <span id="typedText"></span><span class="cursor">|</span>
  </div>

  <div class="symbol">⧖</div>
  <div id="countup">Loading…</div>
  <a href="https://www.hyperfollow.com/spywxlf" class="back-arrow">←</a>
</div>

<script>
/* ===== Typed message system ===== */
(function(){
  const line = document.getElementById("typedLine");
  const textEl = document.getElementById("typedText");

  const messages = [
    " When Will It End ?",
    "Soon ?",
    "Runn.ing 0ut 0f Ti.me",
    "Trying To Fix ∆ Broken Time-line",
    "It Will ∆LL M∆ke Sense One D∆Y",
    "*D∆¥SB3F0R3D¥1N9*"
  ];

  const ITSME_CHANCE = 1/83;
  const ONLOAD_CHANCE = 1/3;

  const RETRY_INTERVAL = 1000;
  const RETRY_CHANCE = 0.03; // ← 3% per second

  const TYPO_CHANCE = 0.12;

  let spawned = false;
  let retryTimer;

  function randomWrongChar() {
    const pool = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789∆*?.";
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function startTyping(text, isItsMe) {
    spawned = true;
    clearInterval(retryTimer);

    line.style.display = "block";
    textEl.textContent = "";
    if (isItsMe) line.style.setProperty("--typed-color", "rgba(255,200,60,.78)");

    let i = 0;

    function typeNext() {
      const ch = text[i];

      if (!isItsMe && ch !== " " && Math.random() < TYPO_CHANCE) {
        textEl.textContent += randomWrongChar();
        setTimeout(() => {
          textEl.textContent = textEl.textContent.slice(0, -1);
          textEl.textContent += ch;
          i++;
          proceed();
        }, 240);
      } else {
        textEl.textContent += ch;
        i++;
        proceed();
      }
    }

    function proceed() {
      if (i < text.length) {
        setTimeout(typeNext, 260 + Math.random() * 200);
      } else {
        morph();
      }
    }

    function morph() {
      const chars = textEl.textContent.split("");
      let k = 0;
      const m = setInterval(() => {
        chars[k++] = "⧖";
        textEl.textContent = chars.join("");
        if (k >= chars.length) {
          clearInterval(m);
          line.classList.add("flicker-once");
        }
      }, 28);
    }

    typeNext();
  }

  if (Math.random() < ITSME_CHANCE) {
    startTyping("it's me", true);
    return;
  }

  if (Math.random() < ONLOAD_CHANCE) {
    startTyping(messages[Math.floor(Math.random() * messages.length)], false);
    return;
  }

  retryTimer = setInterval(() => {
    if (!spawned && Math.random() < RETRY_CHANCE) {
      startTyping(messages[Math.floor(Math.random() * messages.length)], false);
    }
  }, RETRY_INTERVAL);
})();

/* ===== Timer ===== */
const start = new Date("2023-03-27T22:53:00Z");
const el = document.getElementById("countup");

function tick() {
  const s = Math.floor((Date.now() - start) / 1000);
  el.textContent =
    `${Math.floor(s/31536000)}:${Math.floor(s/86400)%365}:${String(Math.floor(s/3600)%24).padStart(2,"0")}:${String(Math.floor(s/60)%60).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
}
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
