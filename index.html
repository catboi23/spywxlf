<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Glitch Timer</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;   /* fallback */
      min-height: 100dvh;  /* mobile-safe viewport */
      display: flex;
      justify-content: center;
      align-items: center;
      background: #2a2a2a;
      font-family: Arial, sans-serif;
      color: #7ec8ff;
      overflow: hidden;
      position: relative;
      padding: 24px; /* breathing room on small screens */
    }

    /* Scan-line flicker */
    body::before {
      content: "";
      position: fixed;
      inset: -50px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(126, 200, 255, 0.08) 0px,
        rgba(126, 200, 255, 0.08) 1px,
        transparent 2px,
        transparent 3px
      );
      mix-blend-mode: screen;
      opacity: 0.4;
      pointer-events: none;
      animation: flicker 2.5s infinite;
    }

    /* Static broken bars */
    body::after {
      content: "";
      position: fixed;
      inset: -40px;
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.7) 10%,
        rgba(0, 0, 0, 0) 20%,
        rgba(0, 0, 0, 0.7) 30%,
        rgba(0, 0, 0, 0) 40%,
        rgba(0, 0, 0, 0.7) 55%,
        rgba(0, 0, 0, 0) 65%,
        rgba(0, 0, 0, 0.7) 75%,
        rgba(0, 0, 0, 0) 100%
      );
      mix-blend-mode: multiply;
      opacity: 0.25;
      pointer-events: none;
    }

    .wrapper {
      text-align: center;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 900px;
    }

    .symbol {
      /* responsive sizing */
      font-size: clamp(2.8rem, 7vw, 4.2rem);
      font-family: "Consolas", "Courier New", monospace;
      transform: scaleX(1.25);
      text-shadow:
        0 0 6px rgba(126, 200, 255, 0.8),
        -3px 0 4px rgba(0, 255, 255, 0.4),
        3px 0 4px rgba(0, 150, 255, 0.4);
      line-height: 1;
    }

    #countup {
      /* responsive sizing */
      font-size: clamp(1.6rem, 6vw, 3rem);
      letter-spacing: 0.05em;
      text-shadow:
        0 0 6px rgba(126, 200, 255, 0.8),
        -2px 0 4px rgba(0, 255, 255, 0.4),
        2px 0 4px rgba(0, 150, 255, 0.4);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;          /* safety */
      text-overflow: clip;
    }

    /* Subtle centered arrow */
    .back-arrow {
      margin-top: 18px;
      font-size: clamp(1.2rem, 4.5vw, 1.6rem);
      color: #5f5f5f;            /* close to background */
      text-decoration: none;
      transition: color 0.25s ease, transform 0.25s ease;
      -webkit-tap-highlight-color: transparent;
      padding: 8px 14px;         /* bigger tap target without being obvious */
      border-radius: 999px;
    }

    .back-arrow:hover {
      color: #8a8a8a;
      transform: translateX(-3px);
    }

    .back-arrow:active {
      transform: translateX(-2px) scale(0.98);
    }

    @keyframes flicker {
      0%, 19%, 21%, 64%, 100% { opacity: 0.35; }
      20%, 22%, 63% { opacity: 0.65; }
      50% { opacity: 0.15; }
      70% { opacity: 0.5; }
    }

    /* Extra-tight screens: reduce letter spacing a touch */
    @media (max-width: 360px) {
      #countup { letter-spacing: 0.03em; }
      body { padding: 18px; }
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="symbol">⧖</div>
    <div id="countup">Loading...</div>

    <a
      href="https://www.hyperfollow.com/spywxlf"
      class="back-arrow"
      aria-label="Go to Hyperfollow"
    >
      ←
    </a>
  </div>

  <script>
    /**
     * Counts upward from March 27, 2023 at 6:53 PM EDT.
     * EDT = UTC-4 → 2023-03-27T22:53:00Z
     * Leap-year accurate (calendar-year increments).
     */
    const startTime = new Date("2023-03-27T22:53:00Z");
    const el = document.getElementById("countup");

    function addYearsUTC(date, yearsToAdd) {
      const d = new Date(date.getTime());
      d.setUTCFullYear(d.getUTCFullYear() + yearsToAdd);
      return d;
    }

    function fullYearsElapsedUTC(start, now) {
      let years = 0;
      let anchor = new Date(start.getTime());

      while (true) {
        const next = addYearsUTC(anchor, 1);
        if (next <= now) {
          years++;
          anchor = next;
        } else {
          break;
        }
      }
      return { years, anchor };
    }

    function update() {
      const now = new Date();

      if (now < startTime) {
        el.textContent = "0:0:00:00:00";
        return;
      }

      const { years, anchor } = fullYearsElapsedUTC(startTime, now);
      const remainingMs = now - anchor;

      const totalSeconds = Math.floor(remainingMs / 1000);
      const seconds = totalSeconds % 60;
      const totalMinutes = Math.floor(totalSeconds / 60);
      const minutes = totalMinutes % 60;
      const totalHours = Math.floor(totalMinutes / 60);
      const hours = totalHours % 24;
      const days = Math.floor(totalHours / 24);

      el.textContent =
        `${years}:${days}:${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
