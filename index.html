<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>⧖</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #2a2a2a;
      font-family: Arial, sans-serif;
      color: #7ec8ff;
      position: relative;
      padding: 28px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -60px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(126,200,255,0.08) 0px,
        rgba(126,200,255,0.08) 1px,
        transparent 2px,
        transparent 3px
      );
      mix-blend-mode: screen;
      opacity: .4;
      pointer-events: none;
      animation: flicker 2.5s infinite;
    }

    body::after {
      content: "";
      position: fixed;
      inset: -60px;
      background: linear-gradient(
        to right,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,.7) 10%,
        rgba(0,0,0,0) 20%,
        rgba(0,0,0,.7) 30%,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,.7) 55%,
        rgba(0,0,0,0) 65%,
        rgba(0,0,0,.7) 75%,
        rgba(0,0,0,0) 100%
      );
      mix-blend-mode: multiply;
      opacity: .25;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      text-align: center;
      padding-top: 2.25em;
    }

    /* ===== Typed message ===== */
    .typed-line {
      position: absolute;
      top: -0.45em;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      font-family: "Trebuchet MS","Verdana",sans-serif;
      font-weight: 700;
      font-size: clamp(.95rem,3.6vw,1.15rem);
      color: var(--typed-color, rgba(0,0,0,.45));
      mix-blend-mode: multiply;
      opacity: .82;
      white-space: pre;
      pointer-events: none;
    }

    .cursor {
      margin-left: .15ch;
      animation: blink .85s steps(1,end) infinite;
      font-weight: 800;
    }

    @keyframes blink {
      0%,49%{opacity:1}
      50%,100%{opacity:0}
    }

    .typed-line.flicker-once {
      animation: flickerOnce .22s steps(1,end) forwards;
    }

    @keyframes flickerOnce {
      0%{opacity:.82}
      45%{opacity:.05}
      100%{opacity:0}
    }

    .symbol {
      font-size: clamp(2.8rem,7vw,4.2rem);
      font-family: Consolas,monospace;
      transform: scaleX(1.25);
      cursor: pointer;
      user-select: none;
      text-shadow:
        0 0 6px rgba(126,200,255,.8),
        -3px 0 4px rgba(0,255,255,.4),
        3px 0 4px rgba(0,150,255,.4);
    }

    #countup {
      font-size: clamp(1.6rem,6vw,3rem);
      letter-spacing: .05em;
      white-space: nowrap;
      text-shadow:
        0 0 6px rgba(126,200,255,.8),
        -2px 0 4px rgba(0,255,255,.4),
        2px 0 4px rgba(0,150,255,.4);
    }

    .back-arrow {
      display: inline-block;
      margin-top: 20px;
      font-size: 1.4rem;
      color: #5a5a5a;
      text-decoration: none;
    }

    @keyframes flicker {
      0%,19%,21%,64%,100%{opacity:.35}
      20%,22%,63%{opacity:.65}
      50%{opacity:.15}
      70%{opacity:.5}
    }

    /* ===== Meltdown ===== */
    body.meltdown::before {
      opacity: .9;
      animation: meltdownFlicker .12s infinite;
    }
    body.meltdown::after {
      opacity: .65;
      animation: tearShift .12s infinite steps(2,end);
    }
    body.meltdown .symbol,
    body.meltdown #countup {
      animation: textGlitch .09s infinite steps(2,end);
    }

    @keyframes meltdownFlicker {
      0%{transform:translate(0,0)}
      25%{transform:translate(-2px,1px)}
      50%{transform:translate(3px,-2px)}
      75%{transform:translate(-1px,-3px)}
      100%{transform:translate(0,0)}
    }
    @keyframes tearShift {
      0%{transform:translate(0,0)}
      25%{transform:translate(-10px,-3px)}
      50%{transform:translate(8px,2px)}
      75%{transform:translate(-6px,4px)}
      100%{transform:translate(0,0)}
    }
    @keyframes textGlitch {
      0%{transform:translate(0,0)}
      20%{transform:translate(-3px,1px)}
      40%{transform:translate(4px,-2px)}
      60%{transform:translate(-2px,-3px)}
      80%{transform:translate(2px,3px)}
      100%{transform:translate(0,0)}
    }
  </style>
</head>

<body>
<div class="wrapper">

  <div class="typed-line" id="typedLine">
    <span id="typedText"></span><span class="cursor">|</span>
  </div>

  <div class="symbol" id="hourglass">⧖</div>
  <div id="countup">Loading...</div>
  <a href="https://www.hyperfollow.com/spywxlf" class="back-arrow">←</a>

</div>

<script>
/* ===== Hourglass redirect (ONLY NEW ADDITION) ===== */
document.getElementById("hourglass").addEventListener("click", () => {
  window.location.href = "https://spywxlf.com";
});

/* ===== Typed message logic (unchanged) ===== */
(function(){
  const ITSME_CHANCE = 1/83;
  const NORMAL_CHANCE = 1/3;

  const spawnItsMe = Math.random() < ITSME_CHANCE;
  const spawnNormal = !spawnItsMe && Math.random() < NORMAL_CHANCE;
  if (!spawnItsMe && !spawnNormal) return;

  const messages = [
    " When Will It End ?",
    "Soon ?",
    "Runn.ing 0ut 0f Ti.me",
    "Trying To Fix ∆ Broken Time-line",
    "It Will ∆LL M∆ke Sense One D∆Y",
    "*D∆¥SB3F0R3D¥1N9*"
  ];

  const text = spawnItsMe ? "it's me" : messages[Math.floor(Math.random()*messages.length)];
  const line = document.getElementById("typedLine");
  const out = document.getElementById("typedText");

  if (spawnItsMe) {
    line.style.setProperty("--typed-color","rgba(255,200,60,.78)");
  }

  line.style.display = "block";
  let i = 0;

  function type(){
    out.textContent += text[i++];
    if (i < text.length) {
      setTimeout(type, 300);
    } else {
      setTimeout(()=>{
        let chars = out.textContent.split("");
        let k = 0;
        const morph = setInterval(()=>{
          if (k >= chars.length) {
            clearInterval(morph);
            line.classList.add("flicker-once");
            return;
          }
          chars[k++] = "⧖";
          out.textContent = chars.join("");
        },28);
      },420);
    }
  }
  setTimeout(type,450);
})();

/* ===== Timer + meltdown logic (unchanged) ===== */
const start = new Date("2023-03-27T22:53:00Z");
const el = document.getElementById("countup");

function addYears(d,y){const n=new Date(d);n.setUTCFullYear(n.getUTCFullYear()+y);return n;}
function yearsElapsed(a,b){
  let y=b.getUTCFullYear()-a.getUTCFullYear();
  let t=addYears(a,y);
  if(t>b)y--;
  return {y,base:addYears(a,y)};
}
function render(ms){
  const s=Math.floor(ms/1000);
  return {
    s:s%60,
    m:Math.floor(s/60)%60,
    h:Math.floor(s/3600)%24,
    d:Math.floor(s/86400)
  };
}
function tick(){
  const now=new Date();
  const {y,base}=yearsElapsed(start,now);
  const r=render(now-base);
  el.textContent =
    `${y}:${r.d}:${String(r.h).padStart(2,"0")}:${String(r.m).padStart(2,"0")}:${String(r.s).padStart(2,"0")}`;
}
setInterval(tick,1000);
tick();

/* meltdown: every 10s, 1 in 5 */
setInterval(()=>{
  if (Math.random() < .2) {
    document.body.classList.add("meltdown");
    setTimeout(()=>document.body.classList.remove("meltdown"),3000);
  }
},10000);
</script>
</body>
</html>
