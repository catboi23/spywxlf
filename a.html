<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glitch Timer</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #2a2a2a;
      font-family: Arial, sans-serif;
      color: #7ec8ff;
      overflow: hidden;
      position: relative;
    }

    /* Scan-line flicker */
    body::before {
      content: "";
      position: fixed;
      inset: -50px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(126, 200, 255, 0.08) 0px,
        rgba(126, 200, 255, 0.08) 1px,
        transparent 2px,
        transparent 3px
      );
      mix-blend-mode: screen;
      opacity: 0.4;
      pointer-events: none;
      animation: flicker 2.5s infinite;
    }

    /* Static “broken bars” overlay */
    body::after {
      content: "";
      position: fixed;
      inset: -40px;
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.7) 10%,
        rgba(0, 0, 0, 0) 20%,
        rgba(0, 0, 0, 0.7) 30%,
        rgba(0, 0, 0, 0) 40%,
        rgba(0, 0, 0, 0.7) 55%,
        rgba(0, 0, 0, 0) 65%,
        rgba(0, 0, 0, 0.7) 75%,
        rgba(0, 0, 0, 0) 100%
      );
      mix-blend-mode: multiply;
      opacity: 0.25;
      pointer-events: none;
    }

    .wrapper {
      text-align: center;
      font-size: 3rem;
      z-index: 1;
    }

    .symbol {
      font-size: 4.2rem;
      margin-bottom: 0.4rem;
      font-family: "Consolas", "Courier New", monospace;
      transform: scaleX(1.25);
      text-shadow:
        0 0 6px rgba(126, 200, 255, 0.8),
        -3px 0 4px rgba(0, 255, 255, 0.4),
        3px 0 4px rgba(0, 150, 255, 0.4);
    }

    #countup {
      letter-spacing: 0.05em;
      text-shadow:
        0 0 6px rgba(126, 200, 255, 0.8),
        -2px 0 4px rgba(0, 255, 255, 0.4),
        2px 0 4px rgba(0, 150, 255, 0.4);
      white-space: nowrap;
    }

    @keyframes flicker {
      0%, 19%, 21%, 64%, 100% { opacity: 0.35; }
      20%, 22%, 63% { opacity: 0.65; }
      50% { opacity: 0.15; }
      70% { opacity: 0.5; }
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="symbol">⧖</div>
    <div id="countup">Loading...</div>
  </div>

  <script>
    /**
     * Counts upward from March 27, 2023 (midnight America/New_York).
     * March 27, 2023 is in EDT (UTC-4), so midnight NY = 2023-03-27T04:00:00Z.
     */
    const startTime = new Date("2023-03-27T04:00:00Z");
    const el = document.getElementById("countup");

    function addYearsUTC(date, yearsToAdd) {
      const d = new Date(date.getTime());
      const y = d.getUTCFullYear();
      d.setUTCFullYear(y + yearsToAdd);
      return d;
    }

    function fullYearsElapsedUTC(start, now) {
      // Find the greatest N such that start + N years <= now (leap-year/calendar accurate)
      let years = 0;
      let anchor = new Date(start.getTime());

      while (true) {
        const next = addYearsUTC(anchor, 1);
        if (next <= now) {
          years += 1;
          anchor = next;
        } else {
          break;
        }
      }
      return { years, anchor };
    }

    function update() {
      const now = new Date();

      // If start is in the future, clamp to zero.
      if (now < startTime) {
        el.textContent = "0:0:00:00:00";
        return;
      }

      const { years, anchor } = fullYearsElapsedUTC(startTime, now);
      let remainingMs = now.getTime() - anchor.getTime();

      const totalSeconds = Math.floor(remainingMs / 1000);
      const seconds = totalSeconds % 60;
      const totalMinutes = Math.floor(totalSeconds / 60);
      const minutes = totalMinutes % 60;
      const totalHours = Math.floor(totalMinutes / 60);
      const hours = totalHours % 24;
      const days = Math.floor(totalHours / 24);

      el.textContent =
        `${years}:${days}:${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
